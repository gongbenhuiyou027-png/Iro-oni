<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ironly — Endless Color Chase</title>
<meta name="description" content="One tile is a different color. Tap it, keep the Oni back, and survive as long as you can. A 5-second-to-learn color reflex game.">

<!-- OGP -->
<meta property="og:title" content="Ironly — Endless Color Chase">
<meta property="og:description" content="One tile is a different color. Tap it before the Oni takes you.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gongbenhuiyou027-png.github.io/Iro-oni/">
<meta property="og:image" content="https://gongbenhuiyou027-png.github.io/Iro-oni/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ironly — Endless Color Chase">
<meta name="twitter:description" content="One tile is a different color. How long can you last?">
<meta name="twitter:image" content="https://gongbenhuiyou027-png.github.io/Iro-oni/ogp.png">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-8YJKBZ8V02"></script>

  function gtag(){dataLayer.push(arguments);}

<style>
  :root{
    --bg:#1c1a20;
    --panel:#26232c;
    --ink:#f2eff5;
    --sub:#9a93a6;
    --accent:#e8b04b;
    --danger:#e85a5a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    transition:background .6s ease;
  }
  .app{width:min(92vw,440px);text-align:center;position:relative;z-index:1;}

  .brand{
    font-size:13px;letter-spacing:.5em;color:var(--sub);
    text-transform:uppercase;margin-bottom:8px;
  }
  h1{
    font-size:clamp(44px,12vw,58px);
    font-weight:900;letter-spacing:.08em;line-height:1.1;
  }
  h1 .oni{color:var(--accent);transition:color .4s;}
  .btn{
    display:inline-block;border:none;cursor:pointer;
    font:inherit;font-weight:800;font-size:18px;letter-spacing:.15em;
    color:#141217;background:var(--accent);
    padding:16px 48px;border-radius:999px;
    transition:transform .15s,background .4s,box-shadow .3s;
    box-shadow:0 6px 24px color-mix(in srgb,var(--accent) 35%,transparent);
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:scale(.96);}
  .btn.ghost{
    background:transparent;color:var(--ink);
    border:1.5px solid #47424f;box-shadow:none;
  }
  .screen{display:none;animation:fadein .35s ease;}
  .screen.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ---------- タイトル ---------- */
  .lead{color:var(--sub);font-size:15px;line-height:1.9;margin:20px 0 32px;}
  .lead b{color:var(--ink);}
  .bestline{margin-top:20px;font-size:13px;color:var(--sub);letter-spacing:.1em;}
  .bestline b{color:var(--accent);font-size:16px;}

  /* ---------- ゲーム ---------- */
  .hud{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:14px;
  }
  .hud .cell{text-align:left;}
  .hud .cell:last-child{text-align:right;}
  .hud .label{font-size:10px;letter-spacing:.25em;color:var(--sub);}
  .hud .val{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;}
  .hud .val.combo{color:var(--accent);transition:color .4s;}

  .timerbar{
    height:6px;border-radius:999px;background:#333039;
    overflow:hidden;margin-bottom:18px;
  }
  .timerbar i{
    display:block;height:100%;width:100%;
    background:var(--accent);border-radius:999px;
    transition:background .4s;
    transform-origin:left;
  }

  #grid{
    display:grid;gap:8px;
    aspect-ratio:1;
    touch-action:manipulation;
    /* 盤面は不透明にして、鬼の闇がタイルの色に一切かからないようにする
       （かかると同じ色でも位置で違って見えてしまい問題が成立しない） */
    background:var(--bg);
  }
  #grid button{
    border:none;border-radius:14px;cursor:pointer;
    transition:filter .1s;
    outline:none;
  }
  #grid button:active{filter:brightness(1.08);}
  #grid button.hit-outline{
    box-shadow:0 0 0 3px var(--ink), 0 0 0 6px color-mix(in srgb,var(--ink) 30%,transparent);
  }
  .reveal-msg{
    margin-top:4px;font-size:14px;color:var(--sub);
    letter-spacing:.15em;min-height:20px;
  }
  .shake{animation:shake .3s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  /* ---------- リザルト ---------- */
  .dev-label{font-size:12px;letter-spacing:.3em;color:var(--sub);margin-bottom:4px;}
  .dev-num{
    font-size:clamp(72px,22vw,96px);font-weight:900;
    color:var(--accent);line-height:1;
    font-variant-numeric:tabular-nums;transition:color .4s;
  }
  .title-name{
    display:inline-block;margin:10px 0 24px;
    font-size:20px;font-weight:800;letter-spacing:.2em;
    border:1.5px solid var(--accent);border-radius:999px;
    padding:8px 26px;color:var(--accent);transition:all .4s;
  }
  .stats{
    display:flex;justify-content:center;flex-wrap:wrap;gap:14px 20px;
    margin-bottom:30px;font-variant-numeric:tabular-nums;
  }
  .stats .label{font-size:10px;letter-spacing:.25em;color:var(--sub);}
  .stats .val{font-size:22px;font-weight:800;}
  .btncol{display:flex;flex-direction:column;gap:12px;align-items:center;}

  /* ---------- ランキング ---------- */
  .rank-list{
    list-style:none;text-align:left;
    max-height:52vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    margin-top:6px;
  }
  .rank-list li{
    display:flex;align-items:center;gap:14px;
    padding:12px 14px;border-radius:14px;
    background:var(--panel);margin-bottom:8px;
    font-variant-numeric:tabular-nums;
    transition:background .4s;
  }
  .rank-list li.me{
    box-shadow:0 0 0 1.5px var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel));
  }
  .rank-list .pos{
    font-size:18px;font-weight:900;color:var(--sub);
    width:28px;text-align:center;flex:none;
  }
  .rank-list li:nth-child(1) .pos{color:var(--accent);}
  .rank-list li:nth-child(2) .pos,
  .rank-list li:nth-child(3) .pos{color:var(--ink);}
  .rank-list .rmain{flex:1;min-width:0;}
  .rank-list .rscore{font-size:19px;font-weight:900;}
  .rank-list .rname{
    display:block;font-size:18px;font-weight:900;color:var(--ink);
    letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .rank-list .rdev.rpts{color:var(--ink);font-size:19px;}
  .rank-list li:nth-child(1) .rname{color:var(--accent);transition:color .4s;}
  .rank-list .rmeta{
    display:block;font-size:11px;color:var(--sub);letter-spacing:.05em;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .rank-list .rdev{
    flex:none;text-align:right;
    font-size:22px;font-weight:900;color:var(--accent);
    transition:color .4s;
  }
  .rank-list .rdev small{display:block;font-size:9px;letter-spacing:.2em;color:var(--sub);}
  .rank-empty{color:var(--sub);font-size:15px;line-height:1.9;margin:34px 0 6px;}
  .rank-banner{
    margin-bottom:18px;font-size:14px;font-weight:800;letter-spacing:.12em;
    color:var(--accent);transition:color .4s;
  }
  .rank-banner b{font-size:20px;}

  /* ---------- 世界ランキング ---------- */
  .rtabs{
    display:flex;justify-content:center;gap:8px;margin:14px 0 12px;
  }
  .rtabs button{
    border:1.5px solid #47424f;background:transparent;color:var(--sub);
    font:inherit;font-size:13px;font-weight:800;letter-spacing:.15em;
    padding:8px 22px;border-radius:999px;cursor:pointer;
    transition:all .25s;
  }
  .rtabs button.on{
    border-color:var(--accent);color:var(--accent);
    background:color-mix(in srgb,var(--accent) 10%,transparent);
  }
  .rank-loading{color:var(--sub);font-size:14px;letter-spacing:.15em;margin:34px 0 6px;}
  .gsubmit{
    display:flex;flex-direction:column;gap:10px;align-items:center;
    margin-bottom:22px;
  }
  .gsubmit input{
    width:min(100%,260px);text-align:center;
    font:inherit;font-size:15px;font-weight:700;color:var(--ink);
    background:var(--panel);border:1.5px solid #47424f;border-radius:999px;
    padding:11px 18px;outline:none;transition:border-color .25s;
  }
  .gsubmit input:focus{border-color:var(--accent);}
  .btn.gbtn{font-size:15px;padding:12px 34px;}
  .btn.gbtn:disabled{opacity:.45;cursor:default;transform:none;}
  .gmsg{
    min-height:18px;font-size:13px;font-weight:800;
    letter-spacing:.1em;color:var(--accent);transition:color .4s;
  }
  .gmsg.err{color:var(--danger);}

  #toast{
    position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#141217;font-size:13px;font-weight:700;
    padding:10px 22px;border-radius:999px;opacity:0;
    transition:all .3s;pointer-events:none;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- フィーバー ---------- */
  body.fever{background:#121014;}
  .gridwrap{position:relative;}
  #grid{transition:box-shadow .25s;border-radius:20px;}
  body.fever #grid{
    box-shadow:0 0 0 2px rgba(255,255,255,.9), 0 0 40px rgba(255,255,255,.18);
  }
  body.fever .timerbar i{background:#fff;}
  body.fever .hud .val.combo{color:#fff;}
  .fever-slot{height:36px;display:flex;align-items:center;justify-content:center;margin-top:12px;}
  .fever-tag{
    display:none;flex-direction:column;align-items:center;gap:6px;
  }
  body.fever .fever-tag{display:flex;animation:tagin .25s ease;}
  @keyframes tagin{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .fever-tag .ftext{
    color:#fff;font-size:13px;font-weight:900;
    letter-spacing:.55em;text-indent:.55em;
  }
  .fever-tag .fbar{
    width:120px;height:2px;background:rgba(255,255,255,.2);overflow:hidden;
  }
  .fever-tag .fbar i{
    display:block;height:100%;background:#fff;transform-origin:left;
  }

  /* ---------- 手応え演出 ---------- */
  /* やり直しボタン：プレイ中だけ表示（誤タップ防止のため盤面から離れた左上に固定） */
  #restart{
    position:fixed;top:14px;left:14px;z-index:5;
    display:none;align-items:center;gap:7px;
    border:1.5px solid #47424f;background:var(--panel);
    color:var(--sub);font:inherit;font-size:12px;font-weight:800;
    letter-spacing:.1em;padding:9px 16px 9px 13px;border-radius:999px;
    cursor:pointer;opacity:.75;
    transition:opacity .25s,border-color .25s,color .25s;
  }
  body.playing #restart{display:flex;}
  #restart:hover{opacity:1;color:var(--ink);border-color:var(--accent);}
  #restart:active{transform:scale(.96);}
  #restart .ricon{font-size:15px;line-height:1;}

  #lang{
    position:fixed;top:14px;right:60px;z-index:5;
    height:38px;padding:0 13px;border-radius:999px;
    border:1.5px solid #47424f;background:var(--panel);
    color:var(--ink);font:inherit;font-size:12px;font-weight:800;
    letter-spacing:.1em;cursor:pointer;opacity:.55;
    display:flex;align-items:center;
    transition:opacity .25s,border-color .25s;
  }
  #lang:hover{opacity:1;border-color:var(--accent);}

  #mute{
    position:fixed;top:14px;right:14px;z-index:5;
    width:38px;height:38px;border-radius:50%;
    border:1.5px solid #47424f;background:var(--panel);
    color:var(--ink);font-size:16px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .25s,border-color .25s;opacity:.55;
  }
  #mute:hover{opacity:1;}
  #mute.off{opacity:.35;}

  .pop{
    position:absolute;transform:translate(-50%,-50%);
    font-size:20px;font-weight:900;color:var(--ink);
    text-shadow:0 2px 12px rgba(0,0,0,.6);
    pointer-events:none;animation:popup .9s ease-out forwards;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  @keyframes popup{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
    18%{opacity:1;transform:translate(-50%,-70%) scale(1.15);}
    35%{transform:translate(-50%,-80%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-190%) scale(.95);}
  }

  #penalty{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    font-size:34px;font-weight:900;color:var(--danger);
    text-shadow:0 2px 16px rgba(0,0,0,.7);
    pointer-events:none;opacity:0;
  }
  #penalty.show{animation:penalty .7s ease-out;}
  @keyframes penalty{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.7);}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
    60%{opacity:1;transform:translate(-50%,-70%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-95%) scale(.95);}
  }

  /* オニ：残り時間が減るほど、盤面の外側から闇が締め上げてくる。
     盤面自体は不透明なので、色の比較には一切影響しない。 */
  /* --oni は「透明でいられる半径」。盤面の四隅までの距離を下回らないようJSが計算するので、
     闇が盤面にかかることはない（かかると同じ色が位置によって違って見えてしまう） */
  #oni{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 47%,
      transparent var(--oni,3000px),
      rgba(150,18,18,.42) calc(var(--oni,3000px) + 26px),
      rgba(72,6,6,.82)   calc(var(--oni,3000px) + 95px),
      rgba(0,0,0,.95)    calc(var(--oni,3000px) + 210px));
    transition:opacity .5s;
  }
  body.playing #oni{opacity:1;}
  body.hurry #oni{
    background:radial-gradient(circle at 50% 47%,
      transparent var(--oni,3000px),
      rgba(226,32,32,.62) calc(var(--oni,3000px) + 18px),
      rgba(96,6,6,.88)    calc(var(--oni,3000px) + 80px),
      rgba(0,0,0,.97)     calc(var(--oni,3000px) + 190px));
    animation:onibreath .85s ease-in-out infinite;
  }
  @keyframes onibreath{
    0%,100%{opacity:1;}
    50%{opacity:.82;}
  }
  #oni.push{animation:onipush .4s ease-out;}
  @keyframes onipush{
    0%{opacity:1;}
    25%{opacity:.3;}
    100%{opacity:1;}
  }
  /* 時間回復の手応え */
  #h-time.gain{animation:timegain .45s ease-out;}
  @keyframes timegain{
    0%{color:var(--accent);transform:scale(1.22);}
    100%{color:inherit;transform:scale(1);}
  }

  /* 変則ラウンドの告知 */
  #roundtag{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    font-size:30px;font-weight:900;color:var(--ink);
    letter-spacing:.25em;text-indent:.25em;white-space:nowrap;
    text-shadow:0 2px 20px rgba(0,0,0,.85);
    pointer-events:none;opacity:0;
  }
  #roundtag.show{animation:roundin 1.1s ease-out;}
  @keyframes roundin{
    0%{opacity:0;transform:translate(-50%,-50%) scale(1.5);letter-spacing:.6em;}
    25%{opacity:1;transform:translate(-50%,-50%) scale(1);letter-spacing:.25em;}
    75%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.05);}
  }

  /* ドリフト：盤面全体の色相がゆっくり回る */
  @keyframes huedrift{
    from{filter:hue-rotate(0deg);}
    to{filter:hue-rotate(360deg);}
  }
  #grid.drift{animation:huedrift 14s linear infinite;}

  /* 残り5秒：タイマーが赤く脈打つ */
  body.hurry .hud .val#h-time{color:var(--danger);animation:pulse .5s ease-in-out infinite;}
  body.hurry .timerbar i{background:var(--danger);}
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }

  /* ゾーン（15コンボ以上）：盤面が発光 */
  body.zone #grid{
    box-shadow:0 0 0 2px var(--accent), 0 0 50px color-mix(in srgb,var(--accent) 45%,transparent);
  }
  body.zone .hud .val.combo{
    animation:pulse .45s ease-in-out infinite;
  }
  body.fever.zone #grid{
    box-shadow:0 0 0 3px #fff, 0 0 60px rgba(255,255,255,.4);
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>
<div id="oni" aria-hidden="true"></div>
<button id="restart" onclick="startGame()" data-i18n-aria="restartAria" data-i18n-title="restartTitle">
  <span class="ricon">↻</span><span class="rlabel" data-i18n="restart">やり直す</span>
</button>
<button id="lang" onclick="toggleLang()" data-i18n-aria="langAria">EN</button>
<button id="mute" onclick="toggleMute()" data-i18n-aria="muteAria">🔊</button>
<div class="app">

  <!-- タイトル画面 -->
  <section class="screen active" id="scr-title">
    <div class="brand" data-i18n="brand">ENDLESS COLOR CHASE</div>
    <h1>Iro<span class="oni">nly</span></h1>
    <p class="lead" data-i18n-html="lead"></p>
    <div class="btncol" style="margin-top:4px">
      <button class="btn" onclick="startGame()" data-i18n="play">はじめる</button>
      <button class="btn ghost" onclick="openRanking('scr-title')" data-i18n="ranking">ランキング</button>
    </div>
    <div class="bestline" id="bestline" hidden>BEST <b id="bestval">0</b></div>
  </section>

  <!-- ゲーム画面 -->
  <section class="screen" id="scr-game">
    <div class="hud">
      <div class="cell"><div class="label">SCORE</div><div class="val" id="h-score">0</div></div>
      <div class="cell"><div class="label">COMBO</div><div class="val combo" id="h-combo">0</div></div>
      <div class="cell"><div class="label">TIME</div><div class="val" id="h-time">30.0</div></div>
    </div>
    <div class="timerbar"><i id="tbar"></i></div>
    <div class="gridwrap">
      <div id="grid"></div>
      <div id="penalty" data-i18n="penalty">−2秒</div>
      <div id="roundtag"></div>
    </div>
    <div class="fever-slot">
      <div class="fever-tag">
        <span class="ftext">FEVER ×2</span>
        <span class="fbar"><i id="fbar"></i></span>
      </div>
    </div>
    <div class="reveal-msg" id="reveal-msg"></div>
  </section>

  <!-- リザルト画面 -->
  <section class="screen" id="scr-result">
    <div class="dev-label" data-i18n="devLabel">色感偏差値</div>
    <div class="dev-num" id="dev-num">50</div>
    <div><span class="title-name" id="title-name">見習い</span></div>
    <div class="stats">
      <div><div class="label">SCORE</div><div class="val" id="r-score">0</div></div>
      <div><div class="label">SURVIVED</div><div class="val" id="r-time">0.0</div></div>
      <div><div class="label">LEVEL</div><div class="val" id="r-lv">1</div></div>
      <div><div class="label">MAX COMBO</div><div class="val" id="r-combo">0</div></div>
    </div>
    <div class="rank-banner" id="rank-banner" hidden></div>
    <div class="gsubmit" id="gsubmit" hidden>
      <input id="gname" maxlength="10" data-i18n-ph="namePh" autocomplete="nickname">
      <button class="btn gbtn" id="gsend" onclick="submitGlobal()" data-i18n="submitBtn">世界ランキングに登録</button>
      <div class="gmsg" id="gmsg"></div>
    </div>
    <div class="btncol">
      <button class="btn" onclick="share()" data-i18n="share">結果をシェア</button>
      <button class="btn ghost" onclick="openRanking('scr-result')" data-i18n="seeRanking">ランキングを見る</button>
      <button class="btn ghost" onclick="startGame()" data-i18n="again">もう一回</button>
    </div>
    <div class="bestline" style="margin-top:24px">BEST <b id="bestval2">0</b></div>
  </section>

  <!-- ランキング画面 -->
  <section class="screen" id="scr-ranking">
    <div class="brand">TOP 10 RANKING</div>
    <h1 style="font-size:clamp(30px,9vw,40px);margin-bottom:8px" data-i18n="rankTitle">ランキング</h1>
    <div class="rtabs" id="rtabs" hidden>
      <button id="tab-local" class="on" onclick="rankTab('local')" data-i18n="tabLocal">この端末</button>

  /* ----- 世界ランキング（Supabase REST） ----- */
  const sbConf = () => window.IROONI_SUPABASE || {};
  const sbEnabled = () => !!(sbConf().url && sbConf().anonKey);
  function sbFetch(path, opts = {}){
    const {url, anonKey} = sbConf();
    return fetch(`${url}/rest/v1/${path}`, {
      ...opts,
      headers:{
        'apikey': anonKey,
        'Authorization': `Bearer ${anonKey}`,
        'Content-Type': 'application/json',
        ...(opts.headers || {}),
      },
    });
  }
  // 保存済みの称号は文字列だが、両言語の一覧と突き合わせて現在の言語で描き直す

    for(const L of ['ja','en']){
      const i = I18N[L].titles.indexOf(str);
      if(i >= 0) return I18N[lang].titles[i];
    }
    return str;

  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  window.rankTab = function(which){

  async function fetchWorldBest(){
    const res = await sbFetch(
      `scores?select=name,score,level,combo,dev,title&order=score.desc,created_at.asc&limit=${WORLD_FETCH}`);
    if(!res.ok) throw new Error(res.status);
    const rows = await res.json();
    const seen = new Set(), best = [];
    for(const r of rows){
      const key = String(r.name).trim();
      if(seen.has(key)) continue;
      seen.add(key);
      best.push(r);

    return best;
  }

  const state = {
    running:false, score:0, combo:0, maxCombo:0, level:1,
    timeLeft:START_SEC, answer:-1, lastTick:0, raf:0, shareText:'', elapsed:0,
    feverUntil:0, lastTs:0, lastRank:-1, lastEntry:null, submitted:false,

  function show(id){

  /* ----- サウンド（WebAudioでその場合成・音源ファイル不要） ----- */
  const sound = (() => {
    let ctx = null, master = null;
    let muted = localStorage.getItem('irooni_muted') === '1';

    // 初回タップ時に生成（iOS/Chromeの自動再生制限に対応）
    function ready(){
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return false;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.25;
        master.connect(ctx.destination);
      }
      if(ctx.state === 'suspended') ctx.resume();
      return !muted;
    }

    // 単音。type:波形, freq:周波数, dur:長さ(秒), vol:音量, slide:終端周波数
    function tone(freq, dur, {type='sine', vol=1, delay=0, slide=null, attack=0.005} = {}){
      if(!ready()) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if(slide) osc.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }

    // ノイズバースト（ミスやフィーバーの「シャッ」）
    function noise(dur, {vol=0.5, delay=0, hp=800} = {}){
      if(!ready()) return;
      const t0 = ctx.currentTime + delay;
      const len = Math.ceil(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const f = ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = hp;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur);
    }

    // ペンタトニックでコンボごとに音階が上がる（外れた響きにならない）
    const SCALE = [0, 2, 4, 7, 9];
    function comboPitch(combo){
      const i = Math.max(0, combo - 1);
      const semi = SCALE[i % SCALE.length] + 12 * Math.floor(i / SCALE.length);
      return 440 * Math.pow(2, (semi % 36) / 12);   // 3オクターブで循環
    }

    return {
      get muted(){ return muted; },
      toggle(){
        muted = !muted;
        localStorage.setItem('irooni_muted', muted ? '1' : '0');
        if(!muted){ ready(); tone(880, .12, {type:'triangle', vol:.5}); }
        return muted;
      },
      unlock(){ ready(); },
      hit(combo){
        const f = comboPitch(combo);
        tone(f, .18, {type:'triangle', vol:.5});
        tone(f*2, .1, {type:'sine', vol:.18, delay:.01});
      },
      miss(){
        tone(180, .3, {type:'sawtooth', vol:.35, slide:70});
        noise(.15, {vol:.25, hp:400});
      },
      fever(){
        noise(.3, {vol:.35, hp:1500});
        [0,3,7,12].forEach((s,i) =>
          tone(440*Math.pow(2,s/12), .35, {type:'square', vol:.28, delay:i*.06}));
      },
      countdown(){ tone(880, .07, {type:'square', vol:.3}); },
      variant(){
        // 場面転換らしい上昇3音
        [0,5,10].forEach((s,i) =>
          tone(330*Math.pow(2,s/12), .22, {type:'triangle', vol:.3, delay:i*.07}));
      },
      gameover(){
        [0,-2,-5,-9].forEach((s,i) =>
          tone(440*Math.pow(2,s/12), .5, {type:'triangle', vol:.35, delay:i*.13}));
      },
      fanfare(){
        [0,4,7,12,16].forEach((s,i) =>
          tone(440*Math.pow(2,s/12), .5, {type:'triangle', vol:.32, delay:i*.09}));
      },
    };
  })();

  function vibrate(ms){
    if(navigator.vibrate && !sound.muted){ try{ navigator.vibrate(ms); }catch(e){} }

  /* ----- 得点ポップ ----- */
  function popScore(el, gain){
    const p = document.createElement('span');

    const wrap = $('grid').parentElement;
    const gr = wrap.getBoundingClientRect(), br = el.getBoundingClientRect();
    p.style.left = (br.left - gr.left + br.width/2) + 'px';
    p.style.top  = (br.top  - gr.top  + br.height/2) + 'px';
    wrap.appendChild(p);
    setTimeout(()=>p.remove(), 900);
  }

  /* ----- 色生成 ----- */
  function levelSpec(lv){
    const size = Math.min(2 + Math.floor((lv-1)/4), 5);       // 2x2 → 5x5（緩やかに拡大）
    const diff = 8 + 22 * Math.exp(-(lv-1)/10);               // 色差は緩やかに減衰、下限8で見える範囲を維持
    return {size, diff};
  }
  function hsl(h,s,l){return `hsl(${h} ${s}% ${l}%)`;}

  /* ----- 変則ラウンド ----- */
  const VARIANT_FROM_LEVEL = 10;   // このレベル以降に出現
  const VARIANT_CHANCE = 0.3;      // 出現率
  const VARIANT_BONUS = 1.5;       // 難しいぶん得点にボーナス
  const VARIANT_KEYS = ['drift','inverse'];

  function pickVariant(lv){
    if(lv < VARIANT_FROM_LEVEL) return null;
    if(Math.random() >= VARIANT_CHANCE) return null;
    return VARIANT_KEYS[Math.floor(Math.random()*VARIANT_KEYS.length)];
  }

  function shuffled(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function announceRound(variant){
    const tag = $('roundtag');
    if(!variant){
      tag.classList.remove('show');
      $('reveal-msg').textContent = '';
      return;
    }
    const {name, hint} = t('variants')[variant];
    tag.textContent = name;
    tag.classList.remove('show');
    void tag.offsetWidth;
    tag.classList.add('show');
    $('reveal-msg').textContent = `${name} ── ${hint}`;
    sound.variant();
  }

  function buildLevel(){
    const {size, diff} = levelSpec(state.level);
    const variant = pickVariant(state.level);
    state.variant = variant;

    const n = size*size;
    const grid = $('grid');
    grid.style.gridTemplateColumns = `repeat(${size},1fr)`;
    grid.innerHTML = '';
    grid.classList.toggle('drift', variant === 'drift');

    const h = Math.floor(Math.random()*360);
    let colors;   // 各マスの色（CSS文字列）

    if(variant === 'inverse'){
      // 全マス違う色。1色だけ2枚あり、その2枚を探す
      const s = 55 + Math.random()*20;
      const l = 48 + Math.random()*10;
      const step = 360/n;
      const hues = [];
      for(let i=0;i<n-1;i++) hues.push((h + step*i + (Math.random()-.5)*step*.4) % 360);
      const dup = hues[Math.floor(Math.random()*hues.length)];
      const laid = shuffled(hues.concat(dup));
      state.answers = laid.reduce((acc,v,i)=>(v===dup && acc.push(i), acc), []);
      colors = laid.map(hv => hsl(hv, s, l));
    }else{
      // 通常・ドリフト：1枚だけ色が違う
      const s = 45 + Math.random()*35;
      const l = 38 + Math.random()*26;
      const hueShift = (Math.random()<.5?-1:1) * Math.min(diff*.5, 8);
      const lShift   = (l>55?-1:1) * diff*.55;
      const answer = Math.floor(Math.random()*n);
      state.answers = [answer];
      colors = Array.from({length:n}, (_,i) =>
        i === answer ? hsl(h+hueShift, s, l+lShift) : hsl(h, s, l));
    }
    state.answer = state.answers[0];

    // UIアクセント色を出題色に連動させる（署名演出）
    document.documentElement.style.setProperty('--accent', hsl(h, 75, 62));

    colors.forEach((bg, i) => {
      const b = document.createElement('button');
      b.style.background = bg;
      b.addEventListener('pointerdown', ()=>tap(i, b), {passive:true});
      grid.appendChild(b);
    });
    announceRound(variant);
  }

  /* ----- フィーバー ----- */
  const FEVER_SEC = 5, FEVER_EVERY = 5;
  function inFever(){ return performance.now() < state.feverUntil; }
  function startFever(){
    state.feverUntil = performance.now() + FEVER_SEC*1000;
    document.body.classList.add('fever');
  }
  function stopFever(){
    state.feverUntil = 0;
    document.body.classList.remove('fever');
  }

  /* ----- 入力 ----- */
  const ZONE_COMBO = 15;
  function tap(i, el){
    if(!state.running) return;
    sound.unlock();
    if(state.answers.includes(i)){
      state.combo++;
      state.maxCombo = Math.max(state.maxCombo, state.combo);
      let mult = 1 + Math.min(state.combo,10)*0.2;
      if(inFever()) mult *= 2;
      if(state.variant) mult *= VARIANT_BONUS;
      const gain = Math.round(100 * state.level * mult);
      state.score += gain;
      sound.hit(state.combo);
      vibrate(12);
      popScore(el, gain);
      document.body.classList.toggle('zone', state.combo >= ZONE_COMBO);
      const isFeverStart = state.combo % FEVER_EVERY === 0;
      if(isFeverStart){ startFever(); sound.fever(); vibrate([0,30,40,30]); }
      // 正解で時間が回復＝鬼を押し返す
      state.timeLeft = Math.min(TIME_CAP, state.timeLeft + TIME_GAIN);
      pushBackOni();
      state.level++;
      buildLevel();
    }else{
      state.combo = 0;
      stopFever();
      document.body.classList.remove('zone');
      state.timeLeft = Math.max(0, state.timeLeft - MISS_SEC);
      sound.miss();
      vibrate([0,60,50,60]);
      $('grid').classList.remove('shake');
      void $('grid').offsetWidth;
      $('grid').classList.add('shake');
      flashPenalty();
    }
    paintHud();
  }

  // ミス時の「−2秒」表示
  function flashPenalty(){
    const p = $('penalty');
    p.classList.remove('show');
    void p.offsetWidth;
    p.classList.add('show');
  }

  // 正解時：鬼が一瞬たじろぎ、時間表示が光る
  function pushBackOni(){
    const o = $('oni'), t = $('h-time');
    o.classList.remove('push'); void o.offsetWidth; o.classList.add('push');
    t.classList.remove('gain'); void t.offsetWidth; t.classList.add('gain');
    document.body.classList.remove('hurry');
    state.lastSec = Math.ceil(state.timeLeft);
  }

  /* ----- HUD ----- */
  function paintHud(){
    $('h-score').textContent = state.score.toLocaleString();
    $('h-combo').textContent = state.combo;
    $('h-time').textContent = state.timeLeft.toFixed(1);
    $('tbar').style.transform = `scaleX(${Math.min(1, state.timeLeft/TIME_CAP)})`;
    // 鬼の闇が外側から迫る。半径は盤面の外周〜画面隅の間を補間する
    const r = Math.max(0, Math.min(1, state.timeLeft/TIME_CAP));
    const {minR, maxR} = state.oniRange;
    document.documentElement.style.setProperty('--oni',
      (minR + (maxR - minR) * r).toFixed(0) + 'px');
  }

  // 盤面の四隅までの距離（＝闇が踏み込めない下限）と画面隅までの距離を測る
  function measureOni(){
    const gr = $('grid').getBoundingClientRect();
    if(!gr.width) return;
    const cx = innerWidth/2, cy = innerHeight*0.47;
    const dist = (x,y) => Math.hypot(x-cx, y-cy);
    const minR = Math.max(
      dist(gr.left,gr.top), dist(gr.right,gr.top),
      dist(gr.left,gr.bottom), dist(gr.right,gr.bottom)) + 10;
    const maxR = Math.max(
      dist(0,0), dist(innerWidth,0), dist(0,innerHeight), dist(innerWidth,innerHeight));
    state.oniRange = {minR, maxR: Math.max(maxR, minR)};
  }
  addEventListener('resize', () => { measureOni(); if(state.running) paintHud(); });

  /* ----- ループ ----- */
  function tick(t){
    if(!state.running) return;
    const dt = (t - state.lastTick)/1000;
    state.lastTick = t;
    state.timeLeft = Math.max(0, state.timeLeft - dt);
    state.elapsed += dt;

    // 残り5秒からの秒読み
    const sec = Math.ceil(state.timeLeft);
    if(sec !== state.lastSec){
      if(sec <= 5 && sec > 0 && state.timeLeft > 0){
        sound.countdown();
        document.body.classList.add('hurry');
      }
      state.lastSec = sec;
    }

    if(state.feverUntil){
      if(!inFever()){ stopFever(); }
      else{
        const rem = (state.feverUntil - t) / (FEVER_SEC*1000);
        $('fbar').style.transform = `scaleX(${Math.max(0,rem)})`;
      }
    }
    paintHud();
    if(state.timeLeft <= 0){ endGame(); return; }
    state.raf = requestAnimationFrame(tick);
  }

  /* ----- 開始/終了 ----- */
  window.startGame = function(){
    const wasMidGame = document.body.classList.contains('playing');
    // 前回のリベール待ちを中断（やり直し直後に結果画面へ飛ぶのを防ぐ）
    state.revealTimers.forEach(clearTimeout);
    state.revealTimers = [];
    cancelAnimationFrame(state.raf);

    Object.assign(state,{
      running:true, score:0, combo:0, maxCombo:0, level:1,
      timeLeft:START_SEC, lastSec:START_SEC, elapsed:0,
    });
    sound.unlock();
    stopFever();
    document.body.classList.remove('zone','hurry');
    document.body.classList.add('playing');
    $('reveal-msg').textContent = '';
    if(typeof gtag === 'function') gtag('event', wasMidGame ? 'game_restart' : 'game_start');
    show('scr-game');
    buildLevel();
    measureOni();      // 盤面が配置された後に計測する
    paintHud();
    state.lastTick = performance.now();
    state.raf = requestAnimationFrame(tick);
  };

  function endGame(){
    state.running = false;
    stopFever();
    document.body.classList.remove('zone','hurry');
    cancelAnimationFrame(state.raf);
    sound.gameover();
    vibrate([0,100,60,100]);

    // 2段階リベール：まず正解を控えめに示し、その後素の状態で見せる
    const btns = $('grid').children;
    if(btns[state.answer]){
      btns[state.answer].classList.add('hit-outline');
      $('reveal-msg').textContent = t('here');
    }
    // リベール中にやり直された場合に備え、タイマーは中断できるよう保持する
    state.revealTimers = [
      setTimeout(()=>{
        if(btns[state.answer]) btns[state.answer].classList.remove('hit-outline');
        $('reveal-msg').textContent = t('seeIt');
      }, 1500),
      setTimeout(showResult, 3000),
    ];
  }

  function showResult(){
    state.revealTimers = [];
    document.body.classList.remove('playing');
    // 偏差値：エンドレス化でスコアの幅が桁違いに広がったため対数で写像
    // （1万点→33、10万点→53、100万点→79、400万点超で最上位帯）
    const dev = 30 + 55 / (1 + Math.exp(-(Math.log10(state.score + 1) - 5.15)/0.42));
    const d = Math.floor(dev);
    const THRESHOLDS = [83,79,75,71,67,63,59,55,51,47,43,0];
    const title = t('titles')[THRESHOLDS.findIndex(th => d >= th)];

    $('dev-num').textContent = d;
    $('title-name').textContent = title;
    $('r-score').textContent = state.score.toLocaleString();
    $('r-time').textContent = state.elapsed.toFixed(1);
    $('r-lv').textContent = state.level;
    $('r-combo').textContent = state.maxCombo;

    const isNewBest = state.score > best;
    if(isNewBest){
      best = state.score;
      localStorage.setItem('irooni_best', best);
      setTimeout(()=>{ sound.fanfare(); vibrate([0,40,40,40,40,80]); }, 250);
    }
    $('bestval').textContent = best.toLocaleString();
    $('bestval2').textContent = best.toLocaleString();
    $('bestline').hidden = false;

    // ランキング登録
    state.lastTs = Date.now();
    state.lastEntry = {
      ts: state.lastTs, score: state.score, level: state.level,
      combo: state.maxCombo, dev: d, title,
    };
    state.lastRank = saveRanking(state.lastEntry);

    // 世界ランキング投稿フォーム（Supabase設定時のみ）
    state.submitted = false;
    $('gsubmit').hidden = !sbEnabled();
    if(sbEnabled()){
      $('gname').value = localStorage.getItem('irooni_name') || '';
      $('gsend').disabled = false;
      $('gmsg').textContent = '';
      $('gmsg').classList.remove('err');
    }
    const banner = $('rank-banner');
    if(state.lastRank === 1){
      banner.innerHTML = t('newBest');
      banner.hidden = false;
    }else if(state.lastRank > 0){
      banner.innerHTML = t('rankBanner')(state.lastRank);
      banner.hidden = false;
    }else{
      banner.hidden = true;
    }

    if(typeof gtag === 'function') gtag('event', 'game_end', {
      score: state.score,
      level_reached: state.level,
      max_combo: state.maxCombo,
      deviation: d,
      title_name: title,
    });

    state.shareText =
      t('shareText')(d, title, state.score.toLocaleString(),
                     state.elapsed.toFixed(1), state.level)+
      `https://gongbenhuiyou027-png.github.io/Iro-oni/\n#Ironly`;
    show('scr-result');
  }

  window.share = async function(){
    const text = state.shareText;
    if(typeof gtag === 'function') gtag('event', 'share_click');
    if(navigator.share){
      try{ await navigator.share({text}); return; }catch(e){}
    }
    try{
      await navigator.clipboard.writeText(text);
      const t = $('toast');
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),1800);
    }catch(e){}
  };

  // Rキーでやり直し（入力欄にフォーカスがあるときは無効）
  document.addEventListener('keydown', e => {
    if(e.key !== 'r' && e.key !== 'R') return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '')) return;
    if(document.body.classList.contains('playing')) startGame();
  });

  // ミュート切り替え
  function paintMute(){
    const b = $('mute');
    b.textContent = sound.muted ? '🔇' : '🔊';
    b.classList.toggle('off', sound.muted);
  }
  window.toggleMute = function(){
    sound.toggle();
    paintMute();
    if(typeof gtag === 'function') gtag('event', 'toggle_mute', {muted: sound.muted});
  };
  applyLang();   // 画面の文言を現在の言語で描く（ミュート表示もここで行う）

  // 起動時ベスト表示
  if(best>0){
    $('bestline').hidden = false;
    $('bestval').textContent = best.toLocaleString();
  }
})();
</script>
</body>
